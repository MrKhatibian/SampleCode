<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button Test with Spinner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 3 + FontAwesome -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body {
            font-family: tahoma, sans-serif;
            text-align: center;
            margin-top: 80px;
            background: #f8f8f8;
        }

        button {
            margin: 10px;
            min-width: 130px;
        }

        /* Button loading style */
        .btn-loading {
            pointer-events: none;
            opacity: 0.85;
        }

            .btn-loading .fa-spinner {
                margin-right: 6px;
            }
    </style>
</head>
<body>

    <h3>🌀 Button Test with Loader</h3>

    <button id="btnStartGetXY" class="btn btn-success">
        <i class="fa fa-play"></i> Start
    </button>
    <button id="btnCloseGetXY" class="btn btn-danger">
        <i class="fa fa-times"></i> Close
    </button>

    <script>
        // Helper function to show/hide loader on a button
        function setButtonLoading(btn, isLoading, text) {
            if (!btn) return;

            if (isLoading) {
                btn.disabled = true;
                btn.classList.add("btn-loading");
                btn.dataset.originalText = btn.innerHTML;
                // Use FontAwesome spinner with fa-spin
                btn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> ${text || "Processing..."}`;
            } else {
                btn.disabled = false;
                btn.classList.remove("btn-loading");
                if (btn.dataset.originalText)
                    btn.innerHTML = btn.dataset.originalText;
            }
        }

        // Simulate time-consuming operation
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Event handlers
        async function startAction() {
            const btn = document.getElementById('btnStartGetXY');
            setButtonLoading(btn, true, "Running...");
            await sleep(3000);
            setButtonLoading(btn, false);
            alert("Action completed ✅");
        }

        async function closeAction() {
            const btn = document.getElementById('btnCloseGetXY');
            setButtonLoading(btn, true, "Closing...");
            await sleep(2500);
            setButtonLoading(btn, false);
            alert("Process closed ❌");
        }

        // Attach events using vanilla JS
        document.getElementById('btnStartGetXY').addEventListener('click', startAction);
        document.getElementById('btnCloseGetXY').addEventListener('click', closeAction);
    </script>

</body>
</html>
